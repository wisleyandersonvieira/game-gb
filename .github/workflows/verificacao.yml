# Verificação automática do repositório. Roda em todo envio (push), de
# qualquer branch e de qualquer autor, inclusive do Lovable, e em todo
# pedido de alteração (pull request).
#   1. Barra qualquer arquivo .env (só o .env.example é permitido).
#   2. Barra outros lockfiles: o projeto usa só o bun (bun.lock).
#   3. Instala exatamente o que está no bun.lock e roda o build.
name: Verificação do repositório

on:
  push:
  pull_request:

jobs:
  sem-env:
    name: Nenhum .env no repositório
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Procurar arquivos .env
        run: |
          encontrados=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$' || true)
          if [ -n "$encontrados" ]; then
            echo "::error::Arquivo .env enviado ao GitHub. Ele pode conter chaves secretas."
            echo "Arquivos encontrados:"
            echo "$encontrados"
            echo ""
            echo "O que fazer: tire o arquivo do Git (git rm --cached <arquivo>), confira"
            echo "se ele tinha alguma chave secreta e, se tinha, troque essa chave no Supabase."
            exit 1
          fi
          echo "Nenhum .env no repositório (só o .env.example, que é permitido)."

  so-bun:
    name: Só o bun.lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Procurar outros lockfiles
        run: |
          encontrados=$(git ls-files | grep -E '(^|/)(package-lock\.json|yarn\.lock|pnpm-lock\.yaml)$' || true)
          if [ -n "$encontrados" ]; then
            echo "::error::Lockfile de outro gerenciador enviado. O projeto usa só o bun (bun.lock)."
            echo "Arquivos encontrados:"
            echo "$encontrados"
            echo ""
            echo "Dois lockfiles resolvem versões diferentes dos pacotes e quebram a publicação."
            echo "O que fazer: apague o arquivo (git rm <arquivo>) e use sempre 'bun install',"
            echo "nunca 'npm install' nem 'yarn'."
            exit 1
          fi
          if ! git ls-files --error-unmatch bun.lock > /dev/null 2>&1; then
            echo "::error::O bun.lock sumiu do repositório. Rode 'bun install' e envie o bun.lock."
            exit 1
          fi
          echo "Só o bun.lock no repositório."

  contrato:
    name: Servidor e banco combinam
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toda função chamada pelo servidor existe numa migração
        run: |
          # O servidor chama funções do banco pelo nome. Se o nome não existir
          # em nenhuma migração, a publicação quebra só na hora de usar — foi o
          # que deixou o administrador sem entrar em 23/09/2026.
          faltando=""
          for f in $(grep -rhoE 'rpc\("[a-z_]+"' src | sed -E 's/rpc\("([a-z_]+)"/\1/' | sort -u); do
            # Vale criada (CREATE FUNCTION) ou renomeada (RENAME TO).
            if ! grep -rqE "FUNCTION public\.$f\(" supabase/migrations/ \
               && ! grep -rqE "RENAME TO $f\b" supabase/migrations/; then
              faltando="$faltando $f"
            fi
          done
          if [ -n "$faltando" ]; then
            echo "::error::O servidor chama função que nenhuma migração cria:$faltando"
            exit 1
          fi
          echo "Toda função chamada pelo servidor existe numa migração."
      - name: Toda configuração da tela existe na migração, com o mesmo padrão
        # Roda junto com os testes do servidor (bun test src/), no job de build.
        run: echo "conferido em src/routes/_authenticated/configuracoes.test.ts"
      - name: Nenhuma coluna apagada voltou numa migração posterior
        run: bash supabase/tests/colunas-apagadas.sh
      - name: PBKDF2 dentro do limite da hospedagem
        run: |
          # A Cloudflare (hospedagem do Lovable) recusa PBKDF2 acima de 100.000
          # voltas, e só no ar. Em 24/09/2026 isso deixou o dono da conta sem
          # entrar. Aqui o número é conferido antes de publicar.
          # sed no lugar de grep: "ITERACOES_SENHA" tem underscore, e um
          # [0-9_]+ casava com ele antes do número.
          voltas=$(grep -oE 'ITERACOES_SENHA = [0-9_]+' src/servidor/acesso.ts | sed -E 's/.*= //' | tr -d '_')
          if [ -z "$voltas" ]; then
            echo "::error::Não achei ITERACOES_SENHA em src/servidor/acesso.ts"
            exit 1
          fi
          if [ "$voltas" -gt 100000 ]; then
            echo "::error::ITERACOES_SENHA=$voltas passa do limite da hospedagem (100000)."
            exit 1
          fi
          echo "PBKDF2 com $voltas voltas: dentro do limite."

      - name: Todo segredo usado está no .env.example
        run: |
          faltando=""
          for v in $(grep -rhoE "process\.env\[[\"']([A-Z_]+)[\"']\]" src | grep -oE "[A-Z_]{4,}" | sort -u); do
            # NODE_ENV é do próprio Vite; SUPABASE_SERVICE_ROLE_KEY é o nome antigo,
            # aceito só em desenvolvimento; LOVABLE_* são segredos do próprio Lovable.
            case "$v" in NODE_ENV|SUPABASE_SERVICE_ROLE_KEY|LOVABLE_*) continue;; esac
            if ! grep -q "^$v=" .env.example; then
              faltando="$faltando $v"
            fi
          done
          if [ -n "$faltando" ]; then
            echo "::error::Segredo usado no código e ausente do .env.example:$faltando"
            echo "Sem isso, quem publica não sabe o que precisa cadastrar."
            exit 1
          fi
          echo "Todo segredo usado está documentado no .env.example."

  build:
    name: Build (bun run build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Instalar (exatamente o bun.lock)
        run: bun install --frozen-lockfile
      - name: Testes do servidor (regras que não são do banco)
        # Só src/: supabase/functions/* são testes de Deno, que o bun não roda.
        run: TZ=UTC bun test src/   # UTC e o fuso do servidor em producao
      - name: Build
        run: bun run build
      - name: Conferir que o servidor foi empacotado
        run: |
          # Sem o nitro, o build gera um servidor que depende de node_modules e a
          # publicação no Lovable dá "internal server error".
          if [ ! -f .output/server/index.mjs ] || ! grep -rqF '_serverFn' .output/server; then
            echo "::error::O servidor não foi empacotado pelo nitro (.output/server incompleto)."
            exit 1
          fi
          echo "Servidor empacotado em .output/server."
