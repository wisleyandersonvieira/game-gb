<!-- Recuperação de senha do STGame (Supabase Auth → Email Templates → Reset password). -->
<div style="font-family: 'IBM Plex Sans', Arial, sans-serif; max-width: 520px; margin: 0 auto; color: #0b1a3a;">
  <p style="font-family: Sora, Arial, sans-serif; font-size: 22px; font-weight: 700; margin: 0 0 24px;">
    <span style="color: #1f4fe0;">ST</span>Game
  </p>
  <h2 style="font-family: Sora, Arial, sans-serif; font-size: 20px; font-weight: 600; margin: 0 0 12px;">Criar uma nova senha</h2>
  <p style="font-size: 15px; line-height: 1.5; margin: 0 0 20px;">
    Recebemos um pedido para trocar a senha da sua conta no STGame. Clique no botão abaixo para escolher uma nova.
  </p>
  <p style="margin: 0 0 24px;">
    <a href="{{ .ConfirmationURL }}"
       style="display: inline-block; background: #1f4fe0; color: #ffffff; text-decoration: none; font-weight: 600; padding: 12px 20px; border-radius: 10px;">
      Criar nova senha
    </a>
  </p>
  <p style="font-size: 13px; line-height: 1.5; color: #4b5a78; margin: 0;">
    Se não foi você que pediu, ignore este e-mail: sua senha continua a mesma.
  </p>
</div>
