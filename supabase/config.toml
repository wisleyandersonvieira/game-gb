# Edge Functions do Telegram (Etapa 1.13A). A proteção não é o JWT:
# - telegram-webhook confere o cabeçalho X-Telegram-Bot-Api-Secret-Token;
# - telegram-fila confere o cabeçalho x-fila-segredo (chamada pelo pg_net).
[functions.telegram-webhook]
verify_jwt = false

[functions.telegram-fila]
verify_jwt = false

# Expurgo das fotos de entrega vencidas (Etapa 1.12). Confere o cabeçalho
# x-expurgo-segredo (chamada pelo pg_net, a partir da rotina diária).
[functions.expurgo-fotos]
verify_jwt = false
